<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bg"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
    <clipPath id="ck"><circle cx="256" cy="230" r="148"/></clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#080810"/>
  <circle cx="256" cy="230" r="210" fill="#1e1b4b" opacity="0.5"/>

  <g clip-path="url(#bg)">
    <!-- bold ripple waves -->
    <ellipse cx="256" cy="412" rx="210" ry="48" fill="none" stroke="#312e81" stroke-width="6"   opacity="0.55"/>
    <ellipse cx="256" cy="427" rx="166" ry="36" fill="none" stroke="#4338ca" stroke-width="8"   opacity="0.65"/>
    <ellipse cx="256" cy="440" rx="120" ry="26" fill="none" stroke="#38bdf8" stroke-width="10"  opacity="0.75"/>
    <ellipse cx="256" cy="451" rx="80"  ry="18" fill="none" stroke="#818cf8" stroke-width="11"  opacity="0.88"/>
    <ellipse cx="256" cy="460" rx="42"  ry="12" fill="none" stroke="#a78bfa" stroke-width="13"  opacity="0.98"/>

    <!-- clock outer ring -->
    <circle cx="256" cy="230" r="158" fill="#13132a" stroke="#312e81" stroke-width="6"/>
    <circle cx="256" cy="230" r="148" fill="#0d0d20" stroke="#6366f1" stroke-width="4"/>

    <!-- ticks 12/3/6/9 -->
    <line x1="256" y1="83"  x2="256" y2="103" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <line x1="403" y1="230" x2="383" y2="230" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="377" x2="256" y2="357" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <line x1="109" y1="230" x2="129" y2="230" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <!-- secondary ticks -->
    <line x1="332" y1="100" x2="323" y2="116" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="387" y1="156" x2="372" y2="164" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="387" y1="304" x2="372" y2="296" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="332" y1="360" x2="323" y2="344" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="180" y1="100" x2="189" y2="116" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="125" y1="156" x2="140" y2="164" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="125" y1="304" x2="140" y2="296" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="180" y1="360" x2="189" y2="344" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>

    <g clip-path="url(#ck)">
      <!-- water drop -->
      <path d="M256 112 C256 112 208 178 208 212 C208 240 230 264 256 264 C282 264 304 240 304 212 C304 178 256 112 256 112Z" fill="#38bdf8"/>
      <!-- violet lower fade -->
      <path d="M208 222 C210 250 230 264 256 264 C282 264 302 250 304 222 C292 236 275 242 256 242 C237 242 220 236 208 222Z" fill="#a78bfa" opacity="0.9"/>
      <!-- mid blend -->
      <path d="M209 204 C209 214 208 218 208 222 C220 236 237 242 256 242 C275 242 292 236 304 222 C304 218 303 214 303 204 C291 216 275 222 256 222 C237 222 221 216 209 204Z" fill="#818cf8" opacity="0.35"/>
      <!-- shine -->
      <path d="M236 140 C231 157 230 177 237 187" stroke="rgba(255,255,255,0.62)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="272" cy="127" r="7" fill="rgba(255,255,255,0.42)"/>
      <circle cx="272" cy="127" r="3" fill="rgba(255,255,255,0.68)"/>

      <!-- R detail -->
      <text x="256" y="316"
            text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="32" font-weight="300"
            letter-spacing="4"
            fill="#a78bfa" opacity="0.78">R</text>
      <circle cx="256" cy="328" r="3.5" fill="#38bdf8" opacity="0.65"/>
    </g>

    <!-- clock hands -->
    <line x1="256" y1="230" x2="224" y2="168" stroke="#a78bfa" stroke-width="8"  stroke-linecap="round"/>
    <line x1="256" y1="230" x2="304" y2="206" stroke="#38bdf8" stroke-width="9"  stroke-linecap="round"/>
    <!-- center dot -->
    <circle cx="256" cy="230" r="12" fill="#a78bfa"/>
    <circle cx="256" cy="230" r="5"  fill="#0d0d20"/>
  </g>
</svg>
