<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ripple">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="app-constants.js?v=5"></script>
  <script src="app-notifications.js?v=5"></script>
  <script type="text/babel" src="ios-frame.jsx?v=5"></script>
  <script type="text/babel" src="app-components.jsx?v=5"></script>
  <script type="text/babel" src="app-screens.jsx?v=5"></script>
  <script type="text/babel" src="app-myday.jsx?v=5"></script>
  <script type="text/babel" src="app-extras.jsx?v=5"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--accent:#6366f1;--accent-sec:#8b5cf6;--accent-rgb:99,102,241;--accent-grad:linear-gradient(135deg,#6366f1,#8b5cf6);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;}
    *::-webkit-scrollbar{display:none;}
    body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .6s ease;}
    body.dark{background:#080810;}body.light{background:#e8e4de;}
    @media(max-width:768px){body{align-items:stretch;justify-content:stretch;height:100dvh;height:100vh;overflow:hidden;}}
    #root{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}
    @media(max-width:768px){#root{width:100%;height:100%;height:100dvh;align-items:stretch;}}
    #ambient-root{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .phone-label{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-top:14px;transition:color .4s;}
    body.dark .phone-label{color:rgba(255,255,255,.2);}body.light .phone-label{color:rgba(0,0,0,.25);}
    @media(max-width:768px){.phone-label{display:none;}}

    /* SPLASH */
    #splash{position:fixed;inset:0;z-index:9999;background:#080810;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s ease,transform .7s ease;}
    #splash.hide{opacity:0;transform:scale(1.05);pointer-events:none;}
    .splash-rings{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
    .splash-ring{position:absolute;border-radius:50%;border:2px solid transparent;animation:splashRing 2.2s ease-in-out infinite;}
    .splash-ring:nth-child(1){width:150px;height:150px;border-color:rgba(99,102,241,.2);animation-delay:0s;}
    .splash-ring:nth-child(2){width:115px;height:115px;border-color:rgba(139,92,246,.32);animation-delay:.25s;}
    .splash-ring:nth-child(3){width:82px;height:82px;border-color:rgba(168,85,247,.5);animation-delay:.5s;}
    @keyframes splashRing{0%,100%{transform:scale(1);opacity:.6;}50%{transform:scale(1.07);opacity:1;}}
    .splash-logo-wrap{width:58px;height:58px;display:flex;align-items:center;justify-content:center;animation:splashPop .9s cubic-bezier(.34,1.56,.64,1) .15s both;}
    @keyframes splashPop{from{transform:scale(0) rotate(-15deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
    .splash-title{font-size:38px;font-weight:900;background:linear-gradient(135deg,#818cf8,#c084fc,#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:splashFadeUp .7s ease .5s both;letter-spacing:-.5px;}
    .splash-sub{font-size:13px;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase;animation:splashFadeUp .7s ease .7s both;margin-top:7px;}
    @keyframes splashFadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    .splash-dots{display:flex;gap:9px;margin-top:44px;animation:splashFadeUp .5s ease 1s both;}
    .splash-dot{width:7px;height:7px;border-radius:50%;background:rgba(99,102,241,.7);animation:dotPulse 1.3s ease-in-out infinite;}
    .splash-dot:nth-child(2){animation-delay:.2s;}.splash-dot:nth-child(3){animation-delay:.4s;}
    @keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.75);}50%{opacity:1;transform:scale(1.25);}}

    .app-screen{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:background .4s;padding-top:env(safe-area-inset-top,0px);}
    .overlay{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.65);backdrop-filter:blur(14px);display:flex;flex-direction:column;justify-content:flex-end;}
    @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sheet{border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid rgba(255,255,255,.09);padding:10px 18px 44px;animation:sheetUp .34s cubic-bezier(.32,1.02,.6,1) both;}
    @supports(padding-bottom:env(safe-area-inset-bottom)){.sheet{padding-bottom:calc(44px + env(safe-area-inset-bottom));}}
    .handle{width:36px;height:4px;border-radius:99px;margin:0 auto 18px;}
    .tabbar{position:absolute;bottom:0;left:0;right:0;height:88px;backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-top-width:1px;border-top-style:solid;display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;z-index:20;transition:background .4s,border-color .4s;}
    @supports(padding-bottom:env(safe-area-inset-bottom)){.tabbar{height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}}
    .tab{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:.35;transition:opacity .2s,transform .15s;min-width:56px;}
    .tab.on{opacity:1;}.tab:active{transform:scale(.88);}
    .tab span{font-size:10px;font-weight:600;}
    .tab-pip{width:4px;height:4px;border-radius:50%;margin-top:1px;background:var(--accent);opacity:0;transition:opacity .2s,transform .2s;}
    .tab.on .tab-pip{opacity:1;transform:scale(1.2);}
    .fab{position:absolute;bottom:100px;right:16px;z-index:19;width:54px;height:54px;border-radius:50%;border:none;background:var(--accent-grad);box-shadow:0 8px 28px rgba(var(--accent-rgb),.55);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;}
    .fab:active{transform:scale(.88);box-shadow:0 3px 10px rgba(var(--accent-rgb),.3);}
    @media(max-width:768px){.fab{bottom:calc(88px + env(safe-area-inset-bottom,0px) + 12px);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}75%{transform:scale(.95)}100%{transform:scale(1)}}
    @keyframes checkBounce{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
    @keyframes flicker{0%,100%{transform:scaleY(1) rotate(-2deg)}50%{transform:scaleY(1.1) rotate(2deg)}}
    @keyframes burst{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}60%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--spin)) scale(.4);opacity:0}}
    @keyframes flashOut{0%{transform:translate(-50%,-50%) scale(0);opacity:1}40%{transform:translate(-50%,-50%) scale(1.5);opacity:.8}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
    @keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
    @keyframes tabSlideL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}
    @keyframes tabSlideR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
    @keyframes onboardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,35px) scale(1.08)}}
    @keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-35px,-50px) scale(1.12)}}
    @keyframes blobFadeIn{from{opacity:0}to{opacity:1}}
    @keyframes shimmerText{0%{background-position:-200% center}100%{background-position:200% center}}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .38s cubic-bezier(.4,0,.2,1) both;}
    .tab-slide-left{animation:tabSlideL .24s cubic-bezier(.4,0,.2,1) both;}
    .tab-slide-right{animation:tabSlideR .24s cubic-bezier(.4,0,.2,1) both;}
    .inp{width:100%;padding:13px 15px;border-radius:14px;outline:none;font-family:'Inter',sans-serif;font-size:15px;transition:border-color .2s,box-shadow .2s;}
    .inp:focus{box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18);}
    .inp::placeholder{color:rgba(128,128,140,.5);}
  </style>
</head>
<body class="dark">

<div id="splash">
  <div class="splash-rings">
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
    <div class="splash-logo-wrap">
      <img src="ripple-logo-dark.svg" width="52" height="52" alt="R"
        onerror="this.outerHTML='<span style=font-size:32px;font-weight:900;color:#818cf8>R</span>'"/>
    </div>
  </div>
  <div class="splash-title">Ripple</div>
  <div class="splash-sub">Micro-hábitos</div>
  <div class="splash-dots">
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
  </div>
</div>

<div id="ambient-root"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

function isMobileOrPWA() {
  return window.matchMedia('(max-width: 768px)').matches
    || window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches
    || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (!el) return;
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 750); }, 1100);
}

function HomeScreen({ habits, onToggle, onDelete, onEdit, onTimerOpen, onAdd, onAI, meta, addToast, onThemeToggle, onReorder, reorderMode, onReorderToggle, xp, onShare, onNote, vacationMode }) {
  const T = useT();
  const [filter, setFilter] = useState('Todos');
  const [mounted, setMounted] = useState(false);
  useEffect(() => { setTimeout(() => setMounted(true), 80); }, []);
  const todayKey = todayStr();
  const total = habits.length, done = habits.filter(h=>h.done).length;
  const pct = total===0 ? 0 : Math.round(done/total*100);
  const maxStreak = habits.reduce((m,h)=>Math.max(m,h.streak||0), 0);
  const hour = new Date().getHours();
  const greeting = hour<5?'Buenas noches 🌙':hour<12?'Buenos días ☀️':hour<18?'Buenas tardes 🌤':'Buenas noches 🌙';
  const profileName = meta?.profile?.name;
  const motivation = meta?.profile?.motivation;
  const dailyGoal = meta?.profile?.dailyGoal || 0;
  const quote = useMemo(() => motivation || QUOTES[Math.floor(Math.random()*QUOTES.length)], [motivation]);
  const filtered = filter==='Todos' ? habits : habits.filter(h=>h.category===filter);
  const pending = filtered.filter(h=>!h.done);
  const completed = filtered.filter(h=>h.done);

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
      <div style={{padding:'14px 18px 16px',flexShrink:0,background:T.isDark?'linear-gradient(180deg,rgba(99,102,241,.14) 0%,rgba(139,92,246,.04) 60%,transparent)':'linear-gradient(180deg,rgba(99,102,241,.07) 0%,transparent)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:42,height:42,borderRadius:14,background:'linear-gradient(135deg,rgba(99,102,241,.28),rgba(139,92,246,.18))',border:'1px solid rgba(99,102,241,.28)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 16px rgba(99,102,241,.22)'}}>
              <img src="ripple-logo-dark.svg" width="26" height="26" style={{borderRadius:7}} alt="R" onError={e=>{e.target.style.display='none';e.target.parentNode.innerHTML='<span style="font-size:18px;font-weight:900;color:#818cf8">R</span>';}}/>
            </div>
            <div>
              <p style={{color:T.textDim,fontSize:11,fontWeight:500,lineHeight:1}}>{greeting}{profileName?`, ${profileName}`:''}</p>
              <p style={{fontSize:20,fontWeight:900,lineHeight:1.2,marginTop:2,background:'linear-gradient(135deg,#818cf8,#c084fc)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Ripple</p>
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {maxStreak>0&&<div style={{background:'linear-gradient(135deg,rgba(249,115,22,.18),rgba(234,179,8,.08))',border:'1px solid rgba(249,115,22,.28)',borderRadius:12,padding:'6px 11px',display:'flex',alignItems:'center',gap:5,boxShadow:'0 2px 12px rgba(249,115,22,.18)'}}><span style={{display:'inline-block',animation:'flicker .8s ease-in-out infinite',fontSize:16}}>🔥</span><span style={{color:'#f97316',fontSize:14,fontWeight:800}}>{maxStreak}</span></div>}
            <button onClick={onThemeToggle} style={{width:38,height:38,borderRadius:12,border:`1px solid ${T.cardBorder}`,background:T.isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',transition:'all .2s'}} title={meta.lightMode?'Modo oscuro':'Modo claro'}>{meta.lightMode?'🌙':'☀️'}</button>
            <button onClick={onShare} style={{width:38,height:38,borderRadius:12,border:`1px solid ${T.cardBorder}`,background:T.isDark?'rgba(99,102,241,.08)':'rgba(99,102,241,.05)',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}} title="Compartir">📤</button>
            <button onClick={onAI} style={{width:38,height:38,borderRadius:12,border:`1px solid ${T.cardBorder}`,background:T.isDark?'rgba(99,102,241,.1)':'rgba(99,102,241,.07)',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>🤖</button>
          </div>
        </div>
        <div style={{padding:'16px 18px',display:'flex',alignItems:'center',gap:16,background:T.isDark?'linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.025))':'rgba(255,255,255,.92)',border:`1px solid ${T.cardBorder}`,borderRadius:22,boxShadow:T.isDark?'0 8px 32px rgba(0,0,0,.28)':'0 4px 20px rgba(0,0,0,.07)',animation:mounted?'slideUp .5s ease .1s both':'none'}}>
          <div style={{position:'relative',display:'inline-flex',flexShrink:0}}>
            <Ring pct={mounted?pct:0} size={72} stroke={7} color={done===total&&total>0?'#22c55e':habits.find(h=>!h.done)?.color||T.accent}/>
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:T.text,fontSize:14,fontWeight:900}}>{pct}%</span></div>
          </div>
          <div style={{flex:1,minWidth:0}}>
            {done===total&&total>0?<p style={{color:'#22c55e',fontSize:15,fontWeight:800,animation:'pop .4s ease'}}>¡Día perfecto! 🎉</p>:<p style={{color:T.text,fontSize:15,fontWeight:700}}><span style={{color:T.accent,fontWeight:900}}>{done}</span><span style={{color:T.textDim}}> de {total}</span> completados</p>}
            <p style={{color:T.textDim,fontSize:11,marginTop:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontStyle:'italic'}}>"{quote}"</p>
            <div style={{marginTop:10,height:4,background:T.chipInactive,borderRadius:99,overflow:'hidden'}}>
              <div style={{height:'100%',width:mounted?`${pct}%`:'0%',background:done===total&&total>0?'linear-gradient(90deg,#22c55e,#16a34a)':'linear-gradient(90deg,#6366f1,#a855f7)',borderRadius:99,transition:'width 1.2s cubic-bezier(.4,0,.2,1)'}}/>
            </div>
          </div>
        </div>
      </div>

      {/* XP Bar */}
      {xp>0&&<div style={{padding:'0 16px 8px',flexShrink:0}}><XPBar xp={xp}/></div>}

      {/* Vacation banner */}
      {vacationMode&&<VacationBanner onDisable={()=>{localStorage.setItem('mh4_vacation','false');window.location.reload();}}/>}

      <div style={{padding:'8px 16px 6px',overflowX:'auto',display:'flex',gap:7,flexShrink:0}}>
        {CATS.map(c=><button key={c} onClick={()=>setFilter(c)} style={{padding:'7px 13px',borderRadius:99,fontFamily:'Inter,sans-serif',fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',border:`1px solid ${filter===c?'rgba(99,102,241,.4)':T.cardBorder}`,background:filter===c?'rgba(99,102,241,.25)':T.chipInactive,color:filter===c?'#a5b4fc':T.chipColor,transition:'all .18s',boxShadow:filter===c?'0 2px 10px rgba(99,102,241,.2)':'none'}}>{CAT_IC[c]} {c}</button>)}
      </div>

      {/* Widget motivacional + reordenar */}
      {habits.length>0&&(
        <div style={{padding:'0 16px 8px',flexShrink:0,display:'flex',gap:8,alignItems:'stretch'}}>
          {meta?.profile?.dailyGoal>0&&(
            <div style={{flex:1,padding:'10px 12px',borderRadius:14,background:T.isDark?'rgba(99,102,241,.12)':'rgba(99,102,241,.08)',border:`1px solid ${T.accentBorder}`}}>
              <p style={{color:T.textDim,fontSize:10,fontWeight:700,marginBottom:4}}>🎯 META DIARIA</p>
              <p style={{color:T.text,fontSize:16,fontWeight:900,lineHeight:1}}>{habits.filter(h=>h.done).length}<span style={{color:T.textDim,fontSize:12}}>/{meta.profile.dailyGoal}</span></p>
              <div style={{marginTop:5,height:3,background:T.chipInactive,borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',width:`${Math.min(habits.filter(h=>h.done).length/meta.profile.dailyGoal*100,100)}%`,background:habits.filter(h=>h.done).length>=meta.profile.dailyGoal?'linear-gradient(90deg,#22c55e,#16a34a)':T.accentGrad,borderRadius:99,transition:'width .8s ease'}}/></div>
            </div>
          )}
          {(()=>{const nextA=ACHIEVEMENTS.filter(a=>!a.check(habits,meta))[0];return nextA?(<div style={{flex:1,padding:'10px 12px',borderRadius:14,background:T.chipInactive,border:`1px solid ${T.cardBorder}`}}><p style={{color:T.textDim,fontSize:10,fontWeight:700,marginBottom:4}}>⭐ PRÓXIMO LOGRO</p><div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:16,filter:'grayscale(1)'}}>{nextA.icon}</span><p style={{color:T.text,fontSize:12,fontWeight:600,lineHeight:1.2}}>{nextA.label}</p></div></div>):null;})()}
          {habits.length>1&&<button onClick={onReorderToggle} style={{padding:'8px 12px',borderRadius:14,border:`1px solid ${reorderMode?T.accentBorder:T.cardBorder}`,background:reorderMode?T.accentDim:T.chipInactive,color:reorderMode?T.accentText:T.textDim,fontFamily:'Inter,sans-serif',fontSize:11,fontWeight:700,cursor:'pointer',transition:'all .18s',flexShrink:0,alignSelf:'stretch'}}>{reorderMode?'✓ Listo':'↕'}</button>}
        </div>
      )}

      <div style={{flex:1,overflowY:'auto',padding:'4px 16px 0'}}>
        {filtered.length===0?<div style={{textAlign:'center',marginTop:55,animation:'fadeUp .5s ease both'}}><div style={{fontSize:56,marginBottom:12,filter:'drop-shadow(0 4px 12px rgba(99,102,241,.3))'}}>🌱</div><p style={{color:T.textDim,fontSize:15,fontWeight:600}}>Sin hábitos aquí</p><p style={{color:T.textFaint,fontSize:13,marginTop:6}}>Pulsa <strong style={{color:T.accent}}>+</strong> o 🤖 para empezar</p></div>:(
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {pending.length>0&&<><p style={{color:T.textDim,fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',marginTop:8,display:'flex',alignItems:'center',gap:6}}><span style={{width:6,height:6,borderRadius:'50%',background:'#f97316',display:'inline-block'}}/>Pendientes · {pending.length}</p>{pending.map((h,i)=>(
                <div key={h.id} style={{display:'flex',alignItems:'center',gap:6}}>
                  {reorderMode&&<div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
                    <button onClick={()=>onReorder(h.id,'up')} style={{width:28,height:28,borderRadius:8,border:`1px solid ${T.cardBorder}`,background:T.chipInactive,cursor:'pointer',color:T.textDim,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>↑</button>
                    <button onClick={()=>onReorder(h.id,'down')} style={{width:28,height:28,borderRadius:8,border:`1px solid ${T.cardBorder}`,background:T.chipInactive,cursor:'pointer',color:T.textDim,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>↓</button>
                  </div>}
                  <div style={{flex:1,position:'relative'}}><HabitRow key={h.id} habit={h} idx={i} onToggle={onToggle} onDelete={onDelete} onEdit={onEdit} onTimerOpen={onTimerOpen} today={todayStr()}/>{h.done&&onNote&&<button onClick={()=>onNote(h)} style={{position:'absolute',top:8,right:8,width:26,height:26,borderRadius:8,border:`1px solid ${T.cardBorder}`,background:h.dailyNotes?.[todayStr()]?'rgba(99,102,241,.2)':T.chipInactive,cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',justifyContent:'center'}} title="Añadir nota">✏️</button>}</div>
                </div>
              ))}</>}
            {completed.length>0&&<><p style={{color:T.textDim,fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',marginTop:8,display:'flex',alignItems:'center',gap:6}}><span style={{width:6,height:6,borderRadius:'50%',background:'#22c55e',display:'inline-block'}}/>Completados ✓</p>{completed.map((h,i)=>(
                <div key={h.id} style={{display:'flex',alignItems:'center',gap:6}}>
                  {reorderMode&&<div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
                    <button onClick={()=>onReorder(h.id,'up')} style={{width:28,height:28,borderRadius:8,border:`1px solid ${T.cardBorder}`,background:T.chipInactive,cursor:'pointer',color:T.textDim,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>↑</button>
                    <button onClick={()=>onReorder(h.id,'down')} style={{width:28,height:28,borderRadius:8,border:`1px solid ${T.cardBorder}`,background:T.chipInactive,cursor:'pointer',color:T.textDim,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>↓</button>
                  </div>}
                  <div style={{flex:1,position:'relative'}}><HabitRow key={h.id} habit={h} idx={i} onToggle={onToggle} onDelete={onDelete} onEdit={onEdit} onTimerOpen={onTimerOpen} today={todayStr()}/>{h.done&&onNote&&<button onClick={()=>onNote(h)} style={{position:'absolute',top:8,right:8,width:26,height:26,borderRadius:8,border:`1px solid ${T.cardBorder}`,background:h.dailyNotes?.[todayStr()]?'rgba(99,102,241,.2)':T.chipInactive,cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',justifyContent:'center'}} title="Añadir nota">✏️</button>}</div>
                </div>
              ))}</>}
            <div style={{height:20}}/>
          </div>
        )}
      </div>
      <button className="fab" onClick={onAdd}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  );
}

function App() {
  const [habits,setHabits]=useState(()=>ld('mh4_habits',[]));
  const [meta,setMeta]=useState(()=>ld('mh4_meta',{hadPerfectDay:false,lightMode:false,profile:{name:'',emoji:'😊'}}));
  const [onboarded,setOnboarded]=useState(()=>ld('mh4_onboarded',false));
  const [tab,setTab]=useState('home');
  const [tabDir,setTabDir]=useState('right');
  const [showAdd,setShowAdd]=useState(false);
  const [showAI,setShowAI]=useState(false);
  const [delTarget,setDelTarget]=useState(null);
  const [editTarget,setEditTarget]=useState(null);
  const [timerTarget,setTimerTarget]=useState(null);
  const [confetti,setConfetti]=useState(false);
  const [reorderMode,setReorderMode]=useState(false);
  const [xp,setXP]=useState(()=>loadXP());
  const [streakCelebration,setStreakCelebration]=useState(null);
  const [showNote,setShowNote]=useState(null);
  const [showShare,setShowShare]=useState(false);
  const [showTemplates,setShowTemplates]=useState(false);
  const [showBackup,setShowBackup]=useState(false);
  const [vacationMode,setVacationMode]=useState(()=>{ try{return JSON.parse(localStorage.getItem('mh4_vacation')||'false');}catch{return false;} });
  const {toasts,add:addToast}=useToast();
  const prevDone=useRef(null);
  const prevStreaks=useRef({});
  const todayKey=todayStr();

  useEffect(()=>sv('mh4_habits',habits),[habits]);
  useEffect(()=>sv('mh4_meta',meta),[meta]);
  const T=buildTheme(meta.lightMode,meta.accent||'indigo');

  useEffect(()=>{
    document.body.className=meta.lightMode?'light':'dark';
    const r=document.documentElement;
    r.style.setProperty('--accent',T.accent);r.style.setProperty('--accent-sec',T.accentSec);
    r.style.setProperty('--accent-rgb',T.accentRgb);r.style.setProperty('--accent-grad',T.accentGrad);
    if(window.__setAmbStreak)window.__setAmbStreak(maxStreak,meta.lightMode);
  },[meta.lightMode,T.accent,maxStreak]);

  useEffect(()=>{const p=loadNotifPrefs();if(p.enabled&&getNotifPermission()==='granted')scheduleNotifications(habits,p);},[]);
  useEffect(()=>{const l=localStorage.getItem('mh4_lastReset')||'';if(l!==todayKey){setHabits(p=>p.map(h=>({...h,done:false,count:h.count||0,timeSpent:0})));localStorage.setItem('mh4_lastReset',todayKey);}},[]);

  const total=habits.length,done=habits.filter(h=>h.done).length;
  const maxStreak=habits.reduce((m,h)=>Math.max(m,h.streak||0),0);
  useEffect(()=>{if(window.__setAmbStreak)window.__setAmbStreak(maxStreak,meta.lightMode);},[maxStreak]);
  useEffect(()=>{if(total>0&&done===total&&prevDone.current!==total){setConfetti(true);playSuccessChime();setTimeout(()=>setConfetti(false),3500);if(!meta.hadPerfectDay)setMeta(m=>({...m,hadPerfectDay:true}));}prevDone.current=done;},[done,total]);

  useEffect(()=>{ localStorage.setItem('mh4_vacation', JSON.stringify(vacationMode)); },[vacationMode]);

  const reorderHabit=useCallback((id,dir)=>{
    setHabits(p=>{const idx=p.findIndex(h=>h.id===id);if(idx===-1)return p;const next=[...p];const si=dir==='up'?idx-1:idx+1;if(si<0||si>=next.length)return p;[next[idx],next[si]]=[next[si],next[idx]];return next;});
  },[]);
  const addHabit=useCallback(h=>setHabits(p=>[...p,{id:crypto.randomUUID(),...h}]),[]);
  const saveHabitExtras=useCallback((id,updates)=>setHabits(p=>p.map(h=>h.id===id?{...h,...updates}:h)),[]);
  const addHabits=useCallback(list=>setHabits(p=>[...p,...list]),[]);

  const toggleHabit=useCallback((id,action)=>{
    setHabits(p=>p.map(h=>{
      if(h.id!==id)return h;
      if(h.type==='counter'){
        let count=h.count||0;
        if(action==='inc')count=Math.min(count+1,h.target||8);
        if(action==='dec')count=Math.max(count-1,0);
        const nowDone=count>=(h.target||8);
        let streak=h.streak||0,lastDate=h.lastDate;
        if(nowDone&&!h.done){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);if(lastDate===y)streak+=1;else if(lastDate!==todayKey)streak=1;lastDate=todayKey;setTimeout(()=>addToast(TOAST_MSGS[Math.floor(Math.random()*TOAST_MSGS.length)],h.color,h.icon),80);checkStreakMilestone(h,streak);}
        const hist={...(h.history||{}),[todayKey]:count||undefined};if(!count)delete hist[todayKey];
        return {...h,count,done:nowDone,streak,lastDate,history:hist};
      }
      const nowDone=!h.done;let streak=h.streak||0,lastDate=h.lastDate;
      if(nowDone){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);if(lastDate===y)streak+=1;else if(lastDate!==todayKey)streak=1;lastDate=todayKey;setTimeout(()=>addToast(TOAST_MSGS[Math.floor(Math.random()*TOAST_MSGS.length)],h.color,h.icon),80);checkStreakMilestone(h,streak);}
      else{if(lastDate===todayKey)streak=Math.max(0,streak-1);}
      const hist={...(h.history||{})};if(nowDone)hist[todayKey]=1;else delete hist[todayKey];
      return {...h,done:nowDone,streak,lastDate,history:hist};
    }));
  },[todayKey,addToast]);

  const earnXP = useCallback((amount) => {
    setXP(p => { const next = p + amount; saveXP(next); return next; });
  }, []);

  const checkStreakMilestone=(h,streak)=>{
    const prev=prevStreaks.current[h.id]||0;
    const milestones=[3,7,14,30,60,100];
    const xpAmounts={3:100,7:200,14:350,30:500,60:1000,100:2000};
    milestones.forEach(m=>{
      if(streak===m&&prev<m){
        setTimeout(()=>{setStreakCelebration(m);earnXP(xpAmounts[m]||50);},600);
      }
    });
    prevStreaks.current[h.id]=streak;
  };

  const timerDone=(id,elapsed)=>setHabits(p=>p.map(h=>{if(h.id!==id)return h;const nowDone=elapsed>=(h.target||300)*.8;let streak=h.streak||0,lastDate=h.lastDate;if(nowDone){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);if(lastDate===y)streak+=1;else if(lastDate!==todayKey)streak=1;lastDate=todayKey;}const hist={...(h.history||{})};if(nowDone)hist[todayKey]=elapsed;else delete hist[todayKey];return {...h,done:nowDone,timeSpent:elapsed,streak,lastDate,history:hist};}));
  const editHabit=(id,updates)=>setHabits(p=>p.map(h=>h.id===id?{...h,...updates}:h));
  const deleteHabit=()=>{setHabits(p=>p.filter(h=>h.id!==delTarget.id));setDelTarget(null);};
  const clearAll=()=>{setHabits([]);setMeta(m=>({...m,hadPerfectDay:false}));sv('mh4_lastReset','');};

  const TAB_ORDER=['home','stats','myday','logros','settings'];
  const goTab=id=>{const fi=TAB_ORDER.indexOf(tab),ti=TAB_ORDER.indexOf(id);setTabDir(ti>=fi?'right':'left');setTab(id);};
  const tabs=[
    {id:'home',icon:['M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z','M9 22V12h6v10'],label:'Inicio'},
    {id:'stats',icon:['M18 20V10','M12 20V4','M6 20v-6'],label:'Stats'},
    {id:'logros',icon:'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z',label:'Logros'},
    {id:'myday',icon:['M8 6h13','M8 12h13','M8 18h13','M3 6h.01','M3 12h.01','M3 18h.01'],label:'Mi Día'},
    {id:'settings',icon:'M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z',label:'Ajustes'},
  ];
  const slideClass=`tab-slide-${tabDir}`;

  return (
    <ThemeCtx.Provider value={T}>
      <div className="app-screen" style={{background:T.appBg}}>
        <Confetti active={confetti}/>
        <ToastContainer toasts={toasts}/>
        {!onboarded&&<Onboarding onDone={list=>{if(list.length>0)addHabits(list);setOnboarded(true);sv('mh4_onboarded',true);}}/>}
        {tab==='home'&&<div key="home" className={slideClass} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}><HomeScreen habits={habits} onToggle={toggleHabit} onDelete={setDelTarget} onEdit={setEditTarget} onTimerOpen={setTimerTarget} onAdd={()=>setShowAdd(true)} onAI={()=>setShowAI(true)} meta={meta} addToast={addToast} onThemeToggle={()=>setMeta(m=>({...m,lightMode:!m.lightMode}))} onReorder={reorderHabit} reorderMode={reorderMode} onReorderToggle={()=>setReorderMode(r=>!r)} xp={xp} onShare={()=>setShowShare(true)} onNote={setShowNote} vacationMode={vacationMode}/></div>}
        {tab==='stats'&&<div key="stats" className={slideClass} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}><StatsScreen habits={habits} meta={meta}/></div>}
        {tab==='myday'&&<div key="myday" className={slideClass} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}><MiDiaScreen habits={habits}/></div>}
        {tab==='logros'&&<div key="logros" className={slideClass} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}><LogrosScreen habits={habits} meta={meta}/></div>}
        {tab==='settings'&&<div key="settings" className={slideClass} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}><SettingsScreen meta={meta} onMetaChange={setMeta} habits={habits} onClear={clearAll}/></div>}
        <div className="tabbar" style={{background:T.tabBg,borderTopColor:T.tabBorder}}>
          {tabs.map(t=><div key={t.id} className={`tab${tab===t.id?' on':''}`} onClick={()=>goTab(t.id)}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={tab===t.id?T.accent:'rgba(128,128,140,.45)'} strokeWidth={tab===t.id?2.2:1.8} strokeLinecap="round" strokeLinejoin="round">
              {(Array.isArray(t.icon)?t.icon:[t.icon]).map((p,i)=><path key={i} d={p}/>)}
            </svg>
            <span style={{color:tab===t.id?T.accentText:T.textDim}}>{t.label}</span>
            <div className="tab-pip"/>
          </div>)}
        </div>
        {showAdd&&<AddSheet onClose={()=>setShowAdd(false)} onAdd={addHabit} onTemplate={()=>{setShowAdd(false);setShowTemplates(true);}}/> }
        {showAI&&<AISheet habits={habits} onAdd={addHabit} onClose={()=>setShowAI(false)}/>}
        {delTarget&&<DeleteSheet habit={delTarget} onClose={()=>setDelTarget(null)} onConfirm={deleteHabit}/>}
        {editTarget&&<EditSheet habit={editTarget} onClose={()=>setEditTarget(null)} onSave={editHabit}/>}
        {timerTarget&&<TimerSheet habit={timerTarget} onClose={()=>setTimerTarget(null)} onDone={e=>timerDone(timerTarget.id,e)}/>}
        {streakCelebration&&<StreakCelebration streak={streakCelebration} onClose={()=>setStreakCelebration(null)}/>}
        {showNote&&<HabitNoteSheet habit={showNote} onClose={()=>setShowNote(null)} onSave={saveHabitExtras}/>}
        {showShare&&<ShareProgressSheet habits={habits} meta={meta} onClose={()=>setShowShare(false)}/>}
        {showTemplates&&<TemplateSheet onAdd={addHabit} onClose={()=>setShowTemplates(false)}/>}
        {showBackup&&<BackupSheet onClose={()=>setShowBackup(false)}/>}
        {}
      </div>
    </ThemeCtx.Provider>
  );
}

function Root() {
  useEffect(() => { hideSplash(); }, []);
  if (isMobileOrPWA()) return <App />;
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
      <IOSDevice dark={true}><IOSStatusBar dark={true} time="9:41"/><App/></IOSDevice>
      <p className="phone-label">Ripple · Micro-Hábitos</p>
    </div>
  );
}

function AmbientPortal() {
  const [streak,setStreak]=useState(0);
  const [lightMode,setLightMode]=useState(false);
  useEffect(()=>{window.__setAmbStreak=(s,l)=>{setStreak(s);setLightMode(!!l);};},[]);
  return <AmbientBg maxStreak={streak} lightMode={lightMode}/>;
}

ReactDOM.createRoot(document.getElementById('ambient-root')).render(<AmbientPortal/>);
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').then(r=>console.log('[Ripple] SW:',r.scope)).catch(e=>console.warn('[Ripple] SW falló:',e));});}
</script>
